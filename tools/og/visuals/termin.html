<style>
.tv{position:relative;width:100%;max-width:440px;aspect-ratio:1/.92;margin:0 auto;font-family:Barlow,sans-serif}
.tv-glow{position:absolute;inset:8% 6%;border-radius:50%;background:radial-gradient(circle,rgba(88,208,189,.35),transparent 68%);filter:blur(10px)}
.tv-card{position:absolute;left:9%;right:9%;top:11%;background:#fff;border-radius:22px;padding:22px 22px 18px;box-shadow:0 30px 60px rgba(0,0,0,.35);transform:rotate(-2.5deg)}
.tv-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.tv-head b{font:900 24px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;color:#132e50;letter-spacing:.5px}
.tv-dot{width:12px;height:12px;border-radius:50%;background:#58d0bd;box-shadow:0 0 0 5px rgba(88,208,189,.2)}
.tv-free{margin-left:auto;background:#e8f8f5;color:#177567;font:700 12px Barlow,sans-serif;padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.8px}
.tv-week,.tv-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.tv-week span{font:700 11px Barlow,sans-serif;color:#7a8b8b;text-transform:uppercase;letter-spacing:.6px;padding-bottom:4px}
.tv-days i{font:600 15px/34px Barlow,sans-serif;font-style:normal;color:#132e50;background:#f4f7f7;border-radius:9px}
.tv-days i.off{color:#c3cdcd;background:transparent}
.tv-days i.on{background:#132e50;color:#fff;box-shadow:0 6px 14px rgba(19,46,80,.35)}
.tv-times{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
.tv-times span{font:700 13.5px/32px Barlow,sans-serif;text-align:center;border:2px solid #e0eaea;border-radius:9px;color:#132e50}
.tv-times span.on{border-color:#58d0bd;background:#e8f8f5}
.tv-ok{display:flex;align-items:center;gap:8px;margin-top:14px;background:#58d0bd;color:#0e2340;font:700 14px Barlow,sans-serif;border-radius:10px;padding:10px 12px}
.tv-ok svg{width:20px;height:20px;fill:none;stroke:#0e2340;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tv-chip{position:absolute;display:flex;align-items:center;gap:7px;background:#132e50;color:#fff;border:1px solid rgba(88,208,189,.5);font:700 13.5px Barlow,sans-serif;padding:9px 13px;border-radius:999px;box-shadow:0 12px 26px rgba(0,0,0,.3)}
.tv-chip svg{width:17px;height:17px;fill:none;stroke:#58d0bd;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tv-chip.c1{left:0;top:3%;transform:rotate(-4deg)}.tv-chip.c2{right:0;top:6%;transform:rotate(3deg)}.tv-chip.c3{right:2%;bottom:7%;transform:rotate(-3deg)}
.tv-lang{position:absolute;left:2%;bottom:5%;display:flex;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);padding:7px;border-radius:14px;backdrop-filter:blur(4px)}
.tv-lang span{width:36px;height:36px;border-radius:10px;background:#58d0bd;color:#0e2340;font:800 14px/36px Barlow,sans-serif;text-align:center}
.tv-lang span:nth-child(odd){background:#fff;color:#132e50}
</style>
<div class="tv" aria-hidden="true">
  <div class="tv-glow"></div>
  <div class="tv-card">
    <div class="tv-head"><span class="tv-dot"></span><b>Ihr Termin</b><span class="tv-free">Kostenlos</span></div>
    <div class="tv-week"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
    <div class="tv-days">
      <i>12</i><i>13</i><i>14</i><i>15</i><i>16</i><i>17</i><i class="off">18</i>
      <i>19</i><i class="on">20</i><i>21</i><i>22</i><i>23</i><i>24</i><i class="off">25</i>
    </div>
    <div class="tv-times"><span>09:30</span><span class="on">10:00</span><span>10:30</span><span>11:00</span></div>
    <div class="tv-ok"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Termin gebucht · 30 Min.</div>
  </div>
  <div class="tv-chip c1"><svg viewBox="0 0 24 24"><path d="M6.5 3.5 9 8l-2 2a13 13 0 0 0 7 7l2-2 4.5 2.5-1.4 3.1a2 2 0 0 1-2.2 1.1C10.1 20.4 3.6 13.9 2.3 6.1A2 2 0 0 1 3.4 3.9Z"/></svg>Telefon</div>
  <div class="tv-chip c2"><svg viewBox="0 0 24 24"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg>Video</div>
  <div class="tv-chip c3"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>Vor Ort</div>
  <div class="tv-lang"><span>DE</span><span>EN</span><span>AR</span><span>TR</span></div>
</div>
