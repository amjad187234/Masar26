/* Layout: one centered column like a link card, logo on top, gold-framed buttons below */
:root{
  --bg:#07070a; --panel:#121216; --line:#3a3226; --gold:#d9b46a; --gold-hi:#f3dca0;
  --blue:#2f5bff; --fg:#f2ede3; --muted:#a59e90;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0}
body{font-family:var(--body);min-height:100%;
  background:radial-gradient(120% 60% at 50% 0%,#1a1710 0%,var(--bg) 60%);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{width:180px;height:180px;border-radius:50%;object-fit:cover;
  box-shadow:0 0 0 2px var(--gold),0 0 40px rgba(217,180,106,.25)}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.06em;margin:0;text-align:center;text-wrap:balance;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:-14px 0 0;font-family:var(--display);letter-spacing:.5em;color:var(--blue);font-size:.85rem;font-weight:700;padding-left:.5em}
.rule{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;width:100%}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.links{display:flex;flex-direction:column;gap:12px;width:100%}
a.btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;text-decoration:none;color:var(--fg);
  background:var(--panel);border:1px solid var(--line);transition:border-color .2s,transform .2s}
a.btn:hover,a.btn:focus-visible{border-color:var(--gold);transform:translateY(-1px);outline:none}
a.btn.primary{background:linear-gradient(180deg,#e2c27c,#b88f45);color:#1a1408;border-color:transparent}
.ic{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;background:#1c1c22;color:var(--gold)}
.primary .ic{background:rgba(0,0,0,.18);color:#1a1408}
.ic svg{width:22px;height:22px;fill:currentColor}
.t{display:flex;flex-direction:column;min-width:0;flex:1}
.t b{font-size:1rem}
.t span{font-size:.8rem;color:var(--muted)}
.primary .t span{color:#3b2e14}
.arr{color:var(--gold);font-size:1.2rem}
.primary .arr{color:#1a1408}
.phone{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 16px;border-radius:14px;border:1px dashed var(--line)}
.phone .num{font-size:1.05rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;user-select:all}
.phone button{font:inherit;font-size:.8rem;color:var(--gold);background:none;border:1px solid var(--gold);border-radius:999px;padding:6px 12px;cursor:pointer}
footer{color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-align:center}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
